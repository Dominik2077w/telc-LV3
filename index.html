<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f7d59" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="telc Trainer" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>telc Trainer</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" href="./icons/icon-192.svg" />
    <link rel="stylesheet" href="./styles.css?v=20261021-hv2-preview" />
  </head>
  <body>
    <div class="level-gate" id="levelGate" role="dialog" aria-modal="true" aria-labelledby="levelGateTitle">
      <div class="level-gate-inner">
        <p class="eyebrow">telc C1 Hochschule</p>
        <div class="gate-heading"><h1 id="levelGateTitle">选择训练级别</h1><button class="ghost-button hidden" id="closeLevelGate" type="button">返回练习</button></div>
        <p class="corpus-edition">全部训练语料已按 2026.9 PDF 重新提取覆盖。</p>
        <div class="level-choice-grid">
          <button class="level-choice" type="button" data-level-choice="lv2">
            <strong>LV2</strong>
            <span>段落 A-E 正反面卡片</span>
          </button>
          <button class="level-choice" type="button" data-level-choice="lv3">
            <strong>LV3</strong>
            <span>Richtig / Falsch / Nicht im Text</span>
          </button>
          <button class="level-choice" type="button" data-level-choice="hv1">
            <strong>HV1</strong>
            <span>先记忆正确顺序，再听音选择</span>
          </button>
          <button class="level-choice" type="button" data-level-choice="hv2">
            <strong>HV2</strong>
            <span>听力题干 → 三选一补全</span>
          </button>
          <button class="level-choice" type="button" data-level-choice="writing">
            <strong>作文专题</strong>
            <span>原文主题与正反观点</span>
          </button>
          <button class="level-choice" type="button" data-level-choice="speaking">
            <strong>口语</strong>
            <span>完整德语任务与讨论题</span>
          </button>
          <button class="level-choice" type="button" data-level-choice="baustein">
            <strong>Baustein</strong>
            <span>按 PDF 词语 / 答案复习</span>
          </button>
        </div>
      </div>
    </div>

    <div class="mobile-backdrop hidden" id="mobileBackdrop" aria-hidden="true"></div>
    <main class="app-shell" id="appShell">
      <header class="mobile-bar">
        <button class="mobile-module-button" id="mobileModules" type="button" aria-haspopup="dialog"><span id="mobileLevelLabel">LV3</span><span aria-hidden="true"> ▾</span><span class="sr-only">切换训练模块</span></button>
        <span class="mobile-brand">telc Trainer</span>
        <button class="mobile-settings-button" id="mobileSettings" type="button" aria-controls="practiceSettings" aria-expanded="false">题组 / 设置</button>
      </header>
      <aside class="sidebar" id="practiceSettings" tabindex="-1">
        <div class="sidebar-top">
          <div class="brand">
            <p class="eyebrow" id="appEyebrow">telc C1 Hochschule</p>
            <h1 id="appTitle">telc Trainer</h1>
          </div>
          <button
            class="sidebar-toggle"
            id="sidebarToggle"
            type="button"
            aria-controls="sidebarBody"
            aria-expanded="true"
          >
            收起
          </button>
          <button class="mobile-menu-close" id="mobileCloseSettings" type="button" aria-label="关闭题组设置">完成</button>
        </div>

        <div class="sidebar-body" id="sidebarBody">
          <section class="panel">
            <div class="level-switch" aria-label="训练级别">
              <button class="level-switch-button" type="button" data-level-switch="lv2">LV2</button>
              <button class="level-switch-button" type="button" data-level-switch="lv3">LV3</button>
              <button class="level-switch-button" type="button" data-level-switch="hv1">HV1</button>
              <button class="level-switch-button" type="button" data-level-switch="hv2">HV2</button>
              <button class="level-switch-button" type="button" data-level-switch="writing">作文专题</button>
              <button class="level-switch-button" type="button" data-level-switch="speaking">口语</button>
              <button class="level-switch-button" type="button" data-level-switch="baustein">Baustein</button>
            </div>
          </section>

          <section class="panel">
            <div class="panel-title">
              <span>Teil</span>
              <button class="ghost-button" id="toggleAllButton" type="button">全选</button>
            </div>
            <label class="new-only"><input type="checkbox" id="newOnly" /> 只练 2026.9 新增</label>
            <div class="teil-list" id="teilList"></div>
          </section>

          <section class="panel controls">
            <label>
              <span>Teil 顺序</span>
              <select id="teilOrder">
                <option value="sequential">顺序</option>
                <option value="random">随机</option>
              </select>
            </label>
            <label id="questionOrderLabel">
              <span>组内题目</span>
              <select id="questionOrder">
                <option value="sequential">顺序</option>
                <option value="random">随机</option>
              </select>
            </label>
            <label id="lv2ModeLabel" class="hidden">
              <span>LV2 模式</span>
              <select id="lv2Mode">
                <option value="card">段落卡片</option>
                <option value="global-sort">全局排序</option>
              </select>
            </label>
            <label id="lv2GlobalDisplayLabel" class="hidden">
              <span>全局排序显示</span>
              <select id="lv2GlobalDisplay">
                <option value="chinese">中文</option>
                <option value="german">德语</option>
              </select>
            </label>
            <label id="hv1ModeLabel" class="hidden">
              <span>HV1 模式</span>
              <select id="hv1Mode">
                <option value="listen">先记顺序 → 逐题听音选择</option>
                <option value="cards">逐句复习（按新 PDF）</option>
              </select>
            </label>
            <label>
              <span>轮次</span>
              <select id="roundMode">
                <option value="mistakes">错题轮回</option>
                <option value="single">单轮</option>
              </select>
            </label>
          </section>
        </div>
        <div class="settings-actions"><button class="primary-button" id="startButton" type="button">开始练习</button></div>
      </aside>

      <section class="practice" id="practice">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="sessionMode">未开始</p>
            <h2 id="sessionTitle" tabindex="-1">选择 Teil 后开始练习</h2>
            <span class="new-badge hidden" id="corpusUpdateBadge"></span>
          </div>
          <div class="stats">
            <div><strong id="roundNumber">0</strong><span>轮</span></div>
            <div><strong id="progressText">0/0</strong><span>进度</span></div>
            <div><strong id="mistakeText">0</strong><span>错题</span></div>
          </div>
        </header>

        <div class="card-stage">
          <div class="audio-panel hidden" id="audioPanel"></div>
          <div class="sort-mode hidden" id="sortModeView">
            <div class="sort-header">
              <span id="sortTeilBadge">Teil</span>
              <p id="sortInstruction">从 Sprecher 拖到对应 Leitsatz，松手后生成连线。</p>
            </div>
            <div class="sort-info" id="sortInfo"></div>
            <div class="sort-list" id="sortList"></div>
            <div class="sort-bottom">
              <button class="ghost-button" id="sortShuffleButton" type="button">随机打乱</button>
              <button class="primary-button" id="sortSubmitButton" type="button">提交</button>
            </div>
          </div>
          <article class="question-card" id="questionCard">
            <div class="card-face front-face" id="frontFace">
              <div class="card-meta">
                <span id="teilBadge">Teil</span>
                <span id="questionBadge">Frage</span>
              </div>
              <p class="prompt-label" id="promptLabel">Deutsch</p>
              <p class="german-question" id="germanQuestion" lang="de">Bereit.</p>
              <div class="paragraph-panel hidden" id="paragraphPanel"></div>
              <div class="answer-grid" id="answerGrid"></div>
            </div>

            <div class="card-face back-face hidden" id="backFace">
              <div class="result-line" id="resultLine"></div>
              <dl class="review-grid">
                <div>
                  <dt id="correctAnswerLabel">Antwort</dt>
                  <dd id="correctAnswer">-</dd>
                </div>
                <div>
                  <dt id="reviewGermanLabel">Deutsch</dt>
                  <dd id="reviewGerman" lang="de">-</dd>
                </div>
                <div>
                  <dt id="reviewChineseLabel">中文</dt>
                  <dd id="reviewChinese">-</dd>
                </div>
              </dl>
              <div class="back-actions">
                <button class="ghost-button miss-button hidden" id="missButton" type="button">不记得</button>
                <button class="primary-button next-button" id="nextButton" type="button">下一题</button>
              </div>
            </div>
          </article>
        </div>

        <footer class="round-strip" id="roundStrip"></footer>
      </section>
    </main>

    <script src="./data/lv2_questions.js?v=20261020-pdf-only"></script>
    <script src="./data/lv3_questions.js?v=20261020-pdf-only"></script>
    <script src="./data/hv1_questions.js?v=20261020-hv1-audio"></script>
    <script src="./data/hv2_questions.js?v=20261021-hv2-choice"></script>
    <script src="./hv2-quiz.js?v=20261021-hv2-unrelated-statements"></script>
    <script src="./data/writing_questions.js?v=20261020-pdf-only"></script>
    <script src="./data/baustein_questions.js?v=20261020-pdf-only"></script>
    <script src="./data/speaking_questions.js?v=20261020-pdf-only"></script>
    <script src="./hv1-order.js?v=20261020-pdf-only"></script>
    <script src="./hv1-quiz.js?v=20261020-hv1-audio"></script>
    <script src="./app.js?v=20261021-hv2-unrelated-statements"></script>
  </body>
</html>
